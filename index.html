<!-- ARCHIVO: index.html (Para GitHub Pages) -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POSOQO | Terminal Personal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000; --card: #111; --gold: #F59E0B; --text: #FFF; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 450px; }
    .box { background: var(--card); border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    input { width: 100%; background: #222; border: 1px solid #444; border-radius: 10px; padding: 15px; color: #FFF; text-align: center; font-size: 1.2rem; margin-bottom: 15px; }
    button { width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; margin-bottom: 10px; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-outline { background: transparent; border: 1px solid #555; color: #FFF; }
    .btn-green { background: #10B981; color: #000; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .stat-box { background: #222; padding: 15px; border-radius: 10px; text-align: center; border: 1px dashed #555; }
    .stat-box h4 { margin: 0 0 5px 0; color: var(--gold); }
    .stat-box p { margin: 0; font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2 style="text-align: center; color: var(--gold);">POSOQO Barra</h2>

  <div id="pantallaLogin" class="box" style="display:none;">
    <input type="password" id="txtPin" placeholder="PIN de Personal">
    <button class="btn-gold" onclick="iniciarSesion()">Acceder</button>
  </div>

  <div id="pantallaEspera" class="box" style="display:none; text-align: center;">
    <p style="font-size: 3rem; margin: 0;">📸</p>
    <p>Usa la cámara nativa de tu celular para escanear el QR del cliente.</p>
    <hr style="border-color:#333; margin: 20px 0;">
    <p style="color: #aaa; font-size: 0.9rem;">O ingresa el ID manualmente:</p>
    <input type="text" id="txtBuscar" placeholder="CLI-001">
    <button class="btn-outline" onclick="buscarManual()">Buscar Cliente</button>
  </div>

  <div id="pantallaAcciones" class="box" style="display:none;">
    <h2 id="lblNombre" style="margin-top: 0; text-align: center;">Nombre</h2>
    
    <div class="grid-2">
      <div class="stat-box">
        <h4>🍺 Cervezas</h4>
        <p id="statCerveza">0/9</p>
        <button class="btn-outline" style="margin-top: 10px;" onclick="sumar('cerveza', 1)">+1 Chop</button>
      </div>
      <div class="stat-box">
        <h4>🍴 Menús</h4>
        <p id="statMenu">0/24</p>
        <button class="btn-outline" style="margin-top: 10px;" onclick="sumar('menu', 1)">+1 Menú</button>
      </div>
    </div>

    <hr style="border-color:#333; margin: 20px 0;">
    
    <button id="btnCanjearJarra" class="btn-green" style="display:none;" onclick="canjear('jarra')">Entregar Jarra Gratis</button>
    <button id="btnCanjearPiqueo" class="btn-green" style="display:none;" onclick="canjear('piqueo')">Entregar Piqueo Gratis</button>
    
    <button class="btn-outline" style="margin-top: 10px;" onclick="volver()">Escanear Otro</button>
  </div>
</div>

<script>
  // ==========================================
  // REEMPLAZA ESTO CON LA URL DE TU APPS SCRIPT (NUEVA IMPLEMENTACION)
  const API_URL = "https://script.google.com/macros/s/TU_NUEVO_ENLACE/exec";
  // ==========================================
  
  let pinActual = localStorage.getItem('posoqo_admin_pin') || "";
  let idCliente = null;

  window.onload = () => {
    if(!pinActual) {
      document.getElementById('pantallaLogin').style.display = 'block';
    } else {
      const urlParams = new URLSearchParams(window.location.search);
      const idQR = urlParams.get('id');
      if(idQR) cargarCliente(idQR);
      else document.getElementById('pantallaEspera').style.display = 'block';
    }
  };

  async function llamarAPI(params) {
    const url = new URL(API_URL);
    url.searchParams.append('api', 'true');
    Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
    const res = await fetch(url).then(r => r.json());
    return res;
  }

  async function iniciarSesion() {
    const pin = document.getElementById('txtPin').value;
    const res = await llamarAPI({ accion: 'validarPIN', pin: pin });
    if(res.exito) {
      localStorage.setItem('posoqo_admin_pin', pin);
      window.location.reload();
    } else alert("PIN Incorrecto");
  }

  function buscarManual() {
    const id = document.getElementById('txtBuscar').value;
    if(id) cargarCliente(id);
  }

  async function cargarCliente(id) {
    document.getElementById('pantallaEspera').style.display = 'none';
    const res = await llamarAPI({ accion: 'obtenerEstado', id: id });
    
    if(res.exito) {
      idCliente = id;
      document.getElementById('pantallaAcciones').style.display = 'block';
      document.getElementById('lblNombre').innerText = res.cliente.nombre;
      
      let cervezas = res.saldos.cerveza % 9;
      let menus = res.saldos.menu % 24;
      
      document.getElementById('statCerveza').innerText = `${cervezas}/9`;
      document.getElementById('statMenu').innerText = `${menus}/24`;
      
      // Mostrar botones de canje si cumplen la meta
      document.getElementById('btnCanjearJarra').style.display = (res.saldos.cerveza >= 9) ? 'block' : 'none';
      document.getElementById('btnCanjearPiqueo').style.display = (res.saldos.menu >= 24) ? 'block' : 'none';
      
      // Lógica de alerta para el 50% de descuento en el menú (cada 6 tickets)
      if (menus > 0 && menus % 6 === 0) {
        alert(`¡ATENCIÓN! Este es el ticket #${menus}. Corresponde aplicar 50% de descuento en este menú.`);
      }
      
    } else {
      alert("Cliente no encontrado.");
      volver();
    }
  }

  async function sumar(tipo, cant) {
    const res = await llamarAPI({ accion: 'registrarConsumo', id: idCliente, tipo: tipo, cant: cant, pin: pinActual });
    alert(res.mensaje);
    if(res.exito) cargarCliente(idCliente); // Recargar datos
  }

  async function canjear(tipo) {
    if(confirm(`¿Confirmas la entrega de ${tipo}?`)) {
      const res = await llamarAPI({ accion: 'canjear', id: idCliente, tipo: tipo, pin: pinActual });
      alert(res.mensaje);
      if(res.exito) cargarCliente(idCliente);
    }
  }

  function volver() {
    window.location.href = window.location.pathname; // Limpia la URL
  }
</script>
</body>
</html>
